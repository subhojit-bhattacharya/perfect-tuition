<!--
  PROTOTYPE — issue #9. Throwaway. Not shippable code.

  Revision 2, 2026-08-20. Variant A ("Call first") chosen as the foundation and
  rebuilt against the Owner's directives:
    · Home Tutor Matching retired — no mode field anywhere
    · new board and subject lists, chips filtered by the class chosen
    · class timings and 10 am–10 pm call timings in the copy
    · "Jayeeta Ma'am", mentor; the word "neighbourhood" removed
    · blue / black / yellow / red palette
    · Consent Notice signed off, Telegram sentence removed, Bengali reworded

  Variants B and C are gone; the choice is made. The "Laptop asleep" toggle
  stays, because the failure state is still the thing worth judging.

  Design plan
    Colour  the four directed hues, given jobs rather than sprinkled: black is
            the text, blue is structure and every non-urgent affordance, yellow
            is the highlighter — used behind words, never as a surface — and red
            belongs to exactly one thing, the call. Paper is warmed a few degrees
            toward the yellow so the neutrals read as chosen.
    Type    Georgia for display (real personality, on every handset, no webfont
            to fail behind the CSP); system-ui for body, which on the audience's
            phone is Roboto; ui-monospace for figures and labels.
    Layout  A phone column scrolling inside its own frame, so the sticky call bar
            behaves exactly as it would on a handset.

  Business facts are from v0_GMB (Takeout Export, 2026-08-17) except where the
  Owner has overridden them on 2026-08-20 — those are marked OWNER OVERRIDE.
-->

<script>

  const BIZ = {

  // Consent Notice — signed off by the Owner 2026-08-20. No Telegram sentence;

  const CONSENT = {
    en: `We collect: your name, your phone number, the class and subjects you're asking about,

    bn: `আমরা যা সংগ্রহ করি: আপনার নাম, আপনার ফোন নম্বর, আপনি যে শ্রেণি ও বিষয় সম্পর্কে জানতে চাইছেন,
         এবং বার্তার ঘরে আপনি যা লেখেন। আমরা এটি একটি কাজেই ব্যবহার করি: আপনার সন্তানের পড়াশোনার
         বিষয়ে আপনার সঙ্গে যোগাযোগ করতে। অন্য কোনো কাজে আমরা এটি ব্যবহার করি না, এবং অন্য কারও
         সঙ্গে আপনার তথ্য ভাগ করি না। অনুগ্রহ করে আপনার সন্তানের নাম, স্কুল বা ঠিকানা লিখবেন না।
         আমরা এই তথ্য ২৪ মাস রাখি, তারপর মুছে ফেলি। আইন অনুযায়ী আমাদের অন্তত এক বছর নথি রাখতে হয়,
         তাই তার আগে আপনি মুছে ফেলতে বললে, সেই এক বছর পূর্ণ হওয়ামাত্র আমরা তা মুছে ফেলব।`
  };
  const AGREE = {
    en: "I am the parent or guardian, I am over 18, and I agree to the above.",
    bn: "আমি অভিভাবক, আমার বয়স ১৮ বছরের বেশি, এবং আমি উপরের বিষয়ে সম্মত।"
  };
  const CONSENT_TITLE = { en: "Before you send this", bn: "পাঠানোর আগে পড়ে নিন" };

  const bandFor = (cls) => {
    const n = Number(cls);
    if (!n) return [];
    return Object.values(BANDS).filter(b => b.classes.includes(n));
  };

  const page = () => `
    <header class="masthead">
      <span class="wordmark">Perfect<span>.</span> Tuition</span>
      <span class="since num">Since ${BIZ.since}</span>
    </header>

    <div class="hero">
      <div>
        <p class="eyebrow">Dum Dum Park, Kolkata</p>
        <h1 style="margin-top:9px">Small-batch coaching for <span class="hl">classes 3 to 12</span>.</h1>
        <p class="small" style="margin-top:10px;font-size:14px">
          Fourteen years at the same address. Speak to <strong>Jayeeta Ma'am</strong> —
          the mentor who runs every batch here.
        </p>
      </div>
      <div class="stack">
        <a class="btn btn-call" href="${tel}">
          <span>Call ${BIZ.phoneDisplay}<span class="btn-sub">Calls answered ${BIZ.callHours}</span></span>
        </a>
        <a class="btn btn-wa" href="${waGeneral}" target="_blank" rel="noopener">
          <span class="dot"></span> Message on WhatsApp
        </a>
      </div>
    </div>

    <div class="ledger">
      <div><span class="k num">${BIZ.rating}</span><span class="v">Google rating</span></div>
      <div><span class="k num">${new Date().getFullYear() - BIZ.since}</span><span class="v">Years teaching</span></div>
      <div><span class="k">3–12</span><span class="v">Classes</span></div>
    </div>

    <div class="section">
      <div class="rating">
        <span class="big num">${BIZ.rating}</span>
        <div>
          <div class="stars">★★★★★</div>
          <div class="small" style="margin-top:3px">
            on Google · <a href="${BIZ.mapsUrl}" target="_blank" rel="noopener">read the reviews</a>
          </div>
        </div>
      </div>
      <p class="small">As of ${BIZ.ratingAsOf}.</p>
    </div>

    <div class="section">
      <p class="eyebrow">Who we teach</p>
      <div class="band">
        <h3>${BANDS.junior.label} <span class="cls">${BANDS.junior.tag}</span></h3>
        <p class="boards">${BANDS.junior.boards}</p>
        <p class="small">${BANDS.junior.note} ${BANDS.junior.subjects.join(", ")}.</p>
      </div>
      <div class="band senior">
        <h3>${BANDS.humanities.label} <span class="cls">${BANDS.humanities.tag}</span></h3>
        <p class="boards">${BANDS.humanities.boards}</p>
        <p class="small">${BANDS.humanities.subjects.join(", ")}.</p>
      </div>
      <div class="band senior">
        <h3>${BANDS.commerce.label} <span class="cls">${BANDS.commerce.tag}</span></h3>
        <p class="boards">${BANDS.commerce.boards}</p>
        <p class="small">${BANDS.commerce.subjects.join(", ")}.</p>
      </div>
      <p class="small">${BIZ.fee}.</p>
    </div>

    <div class="section">
      <p class="eyebrow">When batches run</p>
      <table class="timetable">
        <thead><tr><th scope="col">Batch</th><th scope="col">Timing</th></tr></thead>
        <tbody>
          ${TIMETABLE.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}
        </tbody>
      </table>
      <p class="small"><strong>Monday to Friday.</strong> Calls answered ${BIZ.callHours}, every day.</p>
    </div>

    <div class="section">
      <div>
        <p class="eyebrow" style="margin-bottom:7px">Where we are</p>
        <p>${BIZ.addr1}<br>${BIZ.addr2}</p>
      </div>
      <figure class="mapbox">
        <svg viewBox="0 0 400 168" role="img" aria-label="Sketch map of Dum Dum Park showing the centre's location">
          <rect width="400" height="168" fill="var(--paper-2)"/>
          <g stroke="var(--hairline)" stroke-width="9" fill="none">
            <path d="M-10 44 H410"/><path d="M-10 118 H410"/>
            <path d="M96 -10 V178"/><path d="M268 -10 V178"/>
          </g>
          <path d="M-10 80 H410" stroke="var(--blue)" stroke-width="3" opacity=".4" fill="none"/>
          <circle cx="182" cy="80" r="19" fill="var(--red)" opacity=".15"/>
          <circle cx="182" cy="80" r="7" fill="var(--red)"/>
          <text x="196" y="72" font-family="Georgia, serif" font-size="13" fill="var(--ink)">Dum Dum Park</text>
          <text x="196" y="90" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="var(--muted)">444, Dum Dum Park Road</text>
        </svg>
        <figcaption><strong>Placeholder.</strong> Ships as a committed OpenStreetMap image with attribution — the Google Maps iframe was rejected in #10 as a third-party tracker.</figcaption>
      </figure>
    </div>

    <div class="section">
      <h2>Rather we called you?</h2>
      <p class="small">Leave your number and Jayeeta Ma'am will ring back the same day.</p>
      ${form()}
    </div>

    <div class="footnote small">${BIZ.addr1}, ${BIZ.addr2} · ${BIZ.phoneDisplay} · Calls ${BIZ.callHours}</div>

    <div class="stickybar">
      <a class="btn btn-call" href="${tel}">Call now</a>
      <a class="btn btn-wa" href="${waGeneral}" target="_blank" rel="noopener"><span class="dot"></span> WhatsApp</a>
    </div>`;

  const form = () => `
    <form id="enquiry" novalidate>
      <label>Your name
        <input name="parent_name" autocomplete="name" placeholder="e.g. Ananya Das">
      </label>
      <label>Your phone number
        <input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="98765 43210">
        <span class="hint">We call back on this number. Nothing else.</span>
      </label>
      <label>Which class?
        <select name="class_level" id="class_level">
          <option value="">Select a class</option>
          ${Array.from({ length: 10 }, (_, i) => i + 3)
            .map(c => `<option value="${c}">Class ${c}</option>`).join("")}
        </select>
      </label>
      <div>
        <p style="font:600 13px/1.3 system-ui;margin-bottom:7px">Subjects</p>
        <div class="chips" id="subjects"></div>
      </div>
      <label>Anything else? <span style="font-weight:400;color:var(--muted)">(optional)</span>
        <textarea name="message" placeholder="Timings you'd prefer, questions you have…"></textarea>
        <span class="hint">Please do not include your child's name, school, or address.</span>
      </label>

      <section class="consent" aria-labelledby="consent-h">
        <div class="head">
          <h3 id="consent-h" data-consent-title>${CONSENT_TITLE.en}</h3>
          <div class="langs" role="group" aria-label="Notice language">
            <button type="button" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" data-lang="bn" aria-pressed="false">বাংলা</button>
          </div>
        </div>
        <p data-consent-body>${CONSENT.en}</p>
        <label class="agree">
          <input type="checkbox" name="consent">
          <span data-consent-agree>${AGREE.en}</span>
        </label>
      </section>

      <button type="submit" class="btn btn-call">Send my enquiry</button>
      <p class="hint" style="text-align:center">Or just call — most parents do.</p>
      <div id="outcome" hidden></div>
    </form>`;

  // ---- wiring -------------------------------------------------------------

  const screen = document.getElementById("screen");
  const asleep = document.getElementById("asleep");

  asleep.addEventListener("click", () => {
    asleep.setAttribute("aria-pressed", asleep.getAttribute("aria-pressed") === "true" ? "false" : "true");
  });

  function renderSubjects(cls) {
    const box = screen.querySelector("#subjects");
    const bands = bandFor(cls);
    if (!bands.length) {
      box.innerHTML = `<p class="chips-empty">Choose a class and the subjects will appear.</p>`;
      return;
    }
    box.innerHTML = bands.map(b => `
      <div style="width:100%;display:flex;flex-direction:column;gap:7px;margin-bottom:4px">
        ${bands.length > 1 ? `<p class="boards">${b.tag}</p>` : ""}
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          ${b.subjects.map(s => `<button type="button" class="chip" aria-pressed="false">${s}</button>`).join("")}
        </div>
      </div>`).join("");

    box.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") === "true" ? "false" : "true");
      });
    });
  }

  function wire() {
    const form = screen.querySelector("#enquiry");
    const cls  = screen.querySelector("#class_level");

    renderSubjects("");
    cls.addEventListener("change", () => renderSubjects(cls.value));

    screen.querySelectorAll(".langs button").forEach(btn => {
      btn.addEventListener("click", () => {
        const lang = btn.dataset.lang;
        screen.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
        screen.querySelector("[data-consent-body]").textContent  = CONSENT[lang];
        screen.querySelector("[data-consent-agree]").textContent = AGREE[lang];
        screen.querySelector("[data-consent-title]").textContent = CONSENT_TITLE[lang];
      });
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const out    = screen.querySelector("#outcome");
      const name   = form.parent_name.value.trim();
      const phone  = form.phone.value.trim();
      const agreed = form.consent.checked;

      out.hidden = false;

      if (!name || !phone || !agreed) {
        out.className = "result fail";
        out.innerHTML = `<p><strong>Almost there.</strong> We need your name, a phone number,
          and your agreement to the notice above before we can send this.</p>`;
        out.scrollIntoView({ block: "nearest" });
        return;
      }

      out.className = "";
      out.innerHTML = `<div class="sending"><span class="spinner"></span> Sending your enquiry…</div>`;
      out.scrollIntoView({ block: "nearest" });

      // #6: 4-second AbortController timeout. Rejection, non-2xx and timeout are
      // one indistinguishable failure state — never branch on the status code.
      const down = asleep.getAttribute("aria-pressed") === "true";

      setTimeout(() => {
        if (down) {
          const msg = `Hello, I would like to ask about tuition for my child.\n\nName: ${name}\nPhone: ${phone}`;
          out.className = "result fail";
          out.innerHTML = `
            <h3>We couldn't send that just now</h3>
            <p>Our enquiry system isn't answering. Nothing has been lost — send us the same
               message on WhatsApp instead, or simply call. We answer both, ${BIZ.callHours}.</p>
            <div class="stack">
              <a class="btn btn-call" href="${wa(msg)}" target="_blank" rel="noopener">Send it on WhatsApp instead</a>
              <a class="btn btn-wa" href="${tel}">Call ${BIZ.phoneDisplay}</a>
            </div>`;
        } else {
          out.className = "result ok";
          out.innerHTML = `
            <h3>Thank you, ${name.split(" ")[0]}.</h3>
            <p>Your enquiry has reached us. Jayeeta Ma'am calls back the same day, usually within a few hours.</p>
            <p class="small">In a hurry? <a href="${tel}">Call ${BIZ.phoneDisplay}</a> now.</p>`;
        }
        out.scrollIntoView({ block: "nearest" });
      }, down ? 4000 : 900);
    });
  }

  screen.innerHTML = page();
  wire();
})();
</script>
